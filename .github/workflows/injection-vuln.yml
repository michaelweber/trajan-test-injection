name: Injection Vulnerability Demo

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  vulnerable-job:
    runs-on: ubuntu-latest
    steps:
      # VULN: Unsafe checkout (pwnrequest detector)
      - name: Checkout PR code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # VULN: Expression injection (injection detector)
      - name: Run user-controlled command
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Comment: ${{ github.event.comment.body }}"
          npm install
          npm test

      # VULN: Review body injection (review detector)
      - name: Process review
        if: github.event_name == 'pull_request_review'
        run: |
          echo "${{ github.event.review.body }}" > review.txt
          cat review.txt
