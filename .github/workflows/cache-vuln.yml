name: Cache Poisoning Demo

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

jobs:
  cache-then-execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # VULN: Cache restore then execute (cache detector)
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Execute cached code
        run: |
          npm test
          npm run build
